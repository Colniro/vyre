[package]
name = "vyre"
version = "0.12.0"
edition = "2024"
license = "MPL-2.0"
rust-version = "1.90"
description = "Vyre - ein schlanker Browser in Rust auf Basis von Servo"

[dependencies]
servo = "0.8.0"
winit = "0.30.13"
wgpu = "30"
glyphon = "0.12"
pollster = "0.4"
euclid = "0.22"
dpi = "0.1"
url = "2.5"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "logging", "std"] }
arboard = "3"
log = "0.4"
env_logger = "0.11"
# Ohne "single-thread", damit die Filter im Hintergrund gebaut werden können.
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
ureq = "3"
http = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
serde_json = "1"
aes-gcm = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
des = "0.8"
pbkdf2 = "0.12"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
base64 = "0.22"
csv = "1"
rfd = "0.18"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security_Cryptography",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

# Schnelle Builds zum Ausprobieren: optimiert, aber ohne den langsamen letzten Optimierungsschritt.
# cargo run --profile fast
[profile.fast]
inherits = "release"
lto = false
codegen-units = 256
incremental = true
debug = "line-tables-only"

# Debug-Builds mit optimierten Abhängigkeiten (Servo ist unoptimiert unbrauchbar langsam).
[profile.dev.package."*"]
opt-level = 2
